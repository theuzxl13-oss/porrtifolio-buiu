<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · Cardoso Baterias</title>
  <link rel="icon" href="../assets/img/favicon-32.png?v=2" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
  <header class="barra">
    <div class="barra__marca">
      <img src="../assets/img/logo-fundo-escuro.png" alt="Cardoso Baterias" height="32">
      <span>Painel</span>
    </div>
    <p class="barra__status" id="status" role="status" aria-live="polite">Carregando…</p>
    <div class="barra__acoes">
      <a class="botao botao--fantasma" href="../" target="_blank" rel="noopener">Ver site</a>
      <button class="botao botao--fantasma" type="button" id="btn-previa">Prévia</button>
      <button class="botao botao--primario" type="button" id="btn-salvar" disabled>Salvar e publicar</button>
    </div>
  </header>

  <div class="layout">
    <nav class="menu" aria-label="Seções do painel">
      <label class="menu__select-rotulo" for="menu-select">Seção</label>
      <select id="menu-select" class="menu__select"></select>
      <ul id="menu-lista" class="menu__lista"></ul>
    </nav>

    <main class="editor" id="editor" tabindex="-1">
      <p>Carregando conteúdo…</p>
    </main>
  </div>

  <div class="aviso-fixo" id="aviso" hidden></div>

  <script src="admin.js?v=1"></script>
</body>
</html>
