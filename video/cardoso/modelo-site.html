<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeo do site Cardoso</title>
<style>
  @font-face { font-family: "Anton"; src: url({{ANTON}}) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Montserrat"; src: url({{MONT600}}) format("woff2"); font-weight: 600; }
  @font-face { font-family: "Montserrat"; src: url({{MONT800}}) format("woff2"); font-weight: 800; }
  :root { --fundo: #0e0918; --painel: #1a1624; --texto: #e9e6ee; --chama: #ff492c; --azul: #077ac7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font-family: "Montserrat", system-ui, sans-serif; }
  body { display: flex; gap: 28px; align-items: center; justify-content: center; padding: 16px; flex-wrap: wrap; }
  #tela { width: min(100%, 1100px); aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 20px 60px #000a; background: #000; }
  .painel { max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: "Anton", sans-serif; font-weight: 400; font-size: 34px; margin: 0; letter-spacing: .5px; }
  p { margin: 0; line-height: 1.5; font-size: 15px; color: #c9c4d2; }
  button { font: 800 17px "Montserrat", sans-serif; border: 0; border-radius: 12px; padding: 16px 18px; cursor: pointer; color: #fff; }
  #baixar { background: linear-gradient(90deg, #ff492c, #ff8a1f); box-shadow: 0 8px 24px #ff492c55; }
  #assistir { background: var(--painel); border: 1px solid #3e3a46; }
  button:disabled { opacity: .5; cursor: wait; }
  .barra { height: 10px; border-radius: 6px; background: #2c2834; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff492c, #ffd23f, #2ad4e6); }
  #status { min-height: 3em; }
</style>
</head>
<body>
<canvas id="tela" width="1920" height="1080" aria-label="Vídeo Cardoso Baterias"></canvas>
<div class="painel">
  <h1>Cardoso Baterias · vídeo do site 40s</h1>
  <p>Clique em <strong>Baixar MP4</strong> e deixe esta aba aberta, sem minimizar, até terminar (cerca de 40 segundos). O vídeo baixa sozinho, com som.</p>
  <button id="baixar">⬇ Baixar MP4</button>
  <button id="assistir">▶ Assistir com som</button>
  <div class="barra"><i id="progresso"></i></div>
  <p id="status">Pronto.</p>
</div>

<script>
"use strict";
/* =====================================================================
   CARDOSO BATERIAS — VÍDEO DO SITE 40s (1920x1080)
   Toda a imagem sai de render(t) e todo o som de agendarAudio().
   ===================================================================== */
const W = 1920, H = 1080, DUR = 40, FPS = 30;
const C = {
  fundo: "#0e0918", roxo: "#1d0f33", chama: "#ff492c", laranja: "#ff8a1f", amarelo: "#ffd23f",
  azul: "#077ac7", ciano: "#2ad4e6", branco: "#ffffff", texto: "#d9d5df"
};
const canvas = document.getElementById("tela");
const ctx = canvas.getContext("2d");

/* ---------- utilidades ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const eOutElastic = k => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
function hash(n) { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

/* Batida: 120 BPM = uma batida a cada 0,5s */
const BEAT = 0.5;
function batida(t) { // brilho que pulsa em cada batida
  if (t < 3 || t >= 37.5) return 0;
  return Math.exp(-((t - 3) % BEAT) * 9);
}

/* ---------- imagens ---------- */
const LOGO = new Image(); LOGO.src = "{{LOGO}}";
const RAIO = new Image(); RAIO.src = "{{RAIO}}";

/* textura de granulado (gerada uma vez) */
const grao = document.createElement("canvas"); grao.width = grao.height = 256;
{
  const g = grao.getContext("2d"), d = g.createImageData(256, 256), r = mulberry32(42);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
}
let padraoGrao = null;

/* ---------- textos palavra por palavra ---------- */
const cacheMedida = new Map();
function medir(txt, fonte) {
  const k = fonte + "|" + txt;
  if (!cacheMedida.has(k)) { ctx.font = fonte; cacheMedida.set(k, ctx.measureText(txt).width); }
  return cacheMedida.get(k);
}
function gradienteDestaque(x0, x1, tipo, t) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  const s = (Math.sin(t * 3) + 1) * .05;
  if (tipo === "fogo") { g.addColorStop(0, C.chama); g.addColorStop(.55 + s, C.laranja); g.addColorStop(1, C.amarelo); }
  else { g.addColorStop(0, C.ciano); g.addColorStop(.6 + s, "#8fdcff"); g.addColorStop(1, "#4aa3ff"); }
  return g;
}
/* linhas: [{ y, tam, fonte, palavras: [[texto, tempo, estilo]] }]
   estilo: undefined (branco) | "fogo" | "eletrico" | "glitch" */
function palavras(linhas, t, opc = {}) {
  const maxW0 = opc.maxW || W - 240;
  for (const L of linhas) {
    const maxW = L.maxW || maxW0;
    let tam = L.tam;
    const familia = L.fonte || "Anton";
    const peso = L.peso || 400;
    const fonteDe = s => `${peso} ${s}px "${familia}"`;
    const esp = () => medir(" ", fonteDe(tam)) * (L.esp || 1);
    let total;
    for (;;) {
      total = L.palavras.reduce((s, p) => s + medir(p[0], fonteDe(tam)), 0) + esp() * (L.palavras.length - 1);
      if (total <= maxW || tam < 30) break;
      tam -= 4;
    }
    const fonte = fonteDe(tam);
    let x = (L.x ?? W / 2) - total / 2;
    for (const [txt, tw, estilo] of L.palavras) {
      const w = medir(txt, fonte);
      const a = prog(t, tw, tw + (estilo ? .45 : .35));
      if (t >= tw) desenharPalavra(txt, x, w, L.y, fonte, a, estilo, t, tw, L.cor, L.risco !== false);
      x += w + esp();
    }
  }
}
function desenharPalavra(txt, x, w, y, fonte, a, estilo, t, tw, cor, comRisco) {
  const e = eOutExpo(a);
  const cx = x + w / 2;
  ctx.save();
  ctx.font = fonte; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let esc = lerp(estilo ? 1.7 : 1.25, 1, estilo ? eOutBack(a) : e);
  // destaque continua vivo: pulsa a cada batida
  if (estilo && a >= 1) esc *= 1 + batida(t) * .035;
  const dy = (1 - e) * (estilo ? 0 : 70);
  ctx.globalAlpha *= clamp(a * 2.2);
  ctx.translate(cx, y + dy); ctx.scale(esc, esc);
  const desfoque = (1 - e) * 14;
  if (desfoque > .6) ctx.filter = `blur(${desfoque.toFixed(1)}px)`;
  if (estilo === "glitch") {
    const k = Math.floor(t * 24), j = (hash(k) - .5) * 16 * (1 - prog(t, tw + .2, tw + 1.2) * .6);
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = rgba(C.ciano, .75); ctx.fillText(txt, -8 + j, hash(k + 7) * 6 - 3);
    ctx.fillStyle = rgba(C.chama, .9); ctx.fillText(txt, 8 - j, hash(k + 3) * 6 - 3);
    ctx.globalCompositeOperation = "source-over";
    ctx.shadowColor = C.chama; ctx.shadowBlur = 50;
    ctx.fillStyle = gradienteDestaque(-w / 2, w / 2, "fogo", t);
    ctx.fillText(txt, j * .3, 0);
  } else if (estilo) {
    ctx.shadowColor = estilo === "fogo" ? C.chama : C.ciano;
    ctx.shadowBlur = 40 + batida(t) * 30;
    ctx.fillStyle = gradienteDestaque(-w / 2, w / 2, estilo, t);
    ctx.fillText(txt, 0, 0);
    ctx.shadowBlur = 0; ctx.fillText(txt, 0, 0);
    // risco de energia sob a palavra
    const r = eOutCubic(prog(t, tw + .2, tw + .6));
    if (r > 0 && comRisco && txt.length > 3) {
      ctx.fillStyle = gradienteDestaque(-w / 2, w / 2, estilo, t);
      ctx.fillRect(-w / 2, parseFloat(fonte.split(" ")[1]) * .46, w * r, 8);
    }
  } else {
    ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    ctx.fillStyle = cor || C.branco;
    ctx.fillText(txt, 0, 0);
  }
  ctx.restore();
}

/* ---------- raios (descarga elétrica) ---------- */
function raioEletrico(x1, y1, x2, y2, semente, largura, alfa, cor = C.ciano) {
  const r = mulberry32(semente);
  let pts = [[x1, y1], [x2, y2]];
  let desl = Math.hypot(x2 - x1, y2 - y1) * .22;
  for (let n = 0; n < 6; n++) {
    const novo = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      const mx = (ax + bx) / 2, my = (ay + by) / 2, nx = -(by - ay), ny = bx - ax, l = Math.hypot(nx, ny) || 1;
      const d = (r() - .5) * desl;
      novo.push([mx + nx / l * d, my + ny / l * d], pts[i]);
    }
    pts = novo; desl *= .55;
  }
  ctx.save();
  ctx.globalAlpha = alfa; ctx.globalCompositeOperation = "lighter";
  ctx.lineJoin = ctx.lineCap = "round";
  for (const [lw, c, b] of [[largura * 4, cor, 40], [largura, "#ffffff", 10]]) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.shadowColor = cor; ctx.shadowBlur = b; ctx.stroke();
  }
  ctx.restore();
}

/* ---------- faíscas (determinísticas) ---------- */
const EXPLOSOES = [];
function explosao(t0, x, y, n, vel, cores) { EXPLOSOES.push({ t0, x, y, n, vel, cores, s: EXPLOSOES.length * 977 + 13 }); }
explosao(3.0, 580, 420, 110, 1500, [C.amarelo, C.laranja, C.chama, C.branco]);
explosao(6.5, 580, 460, 70, 1200, [C.ciano, C.branco, C.laranja]);
explosao(34.5, 960, 560, 170, 1900, [C.ciano, C.amarelo, C.branco, C.chama]);
explosao(37.55, 960, 330, 80, 1100, [C.amarelo, C.ciano, C.branco]);
// a cada batida, faíscas saem da cabeça da barra de carga
for (let b = 3.5; b < 37.5; b += BEAT) explosao(b, null, null, 7, 380, [C.amarelo, C.ciano, C.branco]);
// raio da cena 2 solta faíscas a cada batida
for (let b = 3.5; b < 6.4; b += BEAT) explosao(b, 640, 200, 14, 700, [C.amarelo, C.laranja, C.branco]);

function desenharFaiscas(t) {
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  for (const E of EXPLOSOES) {
    const age = t - E.t0;
    if (age < 0 || age > 1.3) continue;
    let ox = E.x, oy = E.y;
    if (ox === null) { const c = cabecaBarra(E.t0); ox = c.x; oy = c.y; }
    for (let i = 0; i < E.n; i++) {
      const h1 = hash(E.s + i * 3), h2 = hash(E.s + i * 3 + 1), h3 = hash(E.s + i * 3 + 2);
      const vida = .45 + h3 * .8;
      if (age > vida) continue;
      const ang = h1 * Math.PI * 2, v = E.vel * (.25 + h2 * .75);
      const k = 1 - age / vida, arrasto = (1 - Math.exp(-age * 3)) / 3;
      const x = ox + Math.cos(ang) * v * arrasto, y = oy + Math.sin(ang) * v * arrasto + 600 * age * age;
      const vx = Math.cos(ang) * v * Math.exp(-age * 3), vy = Math.sin(ang) * v * Math.exp(-age * 3) + 1200 * age;
      ctx.strokeStyle = E.cores[i % E.cores.length];
      ctx.globalAlpha = k;
      ctx.lineWidth = 2 + h3 * 4 * k;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - vx * .025, y - vy * .025); ctx.stroke();
    }
  }
  ctx.restore();
}

/* brasas subindo o vídeo todo */
function desenharBrasas(t, forca) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 70; i++) {
    const h1 = hash(i * 11 + 1), h2 = hash(i * 11 + 2), h3 = hash(i * 11 + 3);
    const vel = 50 + h2 * 140, ciclo = H * 1.2;
    const y = H + 60 - ((h1 * ciclo + vel * t) % ciclo);
    const x = h3 * W + Math.sin(t * .9 + i) * 34;
    const piscar = .5 + .5 * Math.sin(t * (4 + h2 * 6) + i);
    const tam = 2 + h1 * 4;
    ctx.globalAlpha = forca * (.25 + .6 * piscar);
    ctx.fillStyle = i % 3 === 0 ? C.ciano : (i % 3 === 1 ? C.laranja : C.amarelo);
    ctx.beginPath(); ctx.arc(x, y, tam, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* ---------- fundo: degradê + luzes desfocadas ---------- */
function fundo(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#150b26"); g.addColorStop(.55, C.fundo); g.addColorStop(1, "#07040d");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cena1 = t < 3;
  const b = batida(t);
  const piscaAlerta = cena1 ? Math.exp(-(t % BEAT) * 6) : 0;
  const luzes = [
    { c: C.chama, x: .25 + .2 * Math.sin(t * .35), y: .25 + .1 * Math.cos(t * .4), r: 820, a: cena1 ? .18 + piscaAlerta * .3 : .42 },
    { c: C.azul, x: .8 + .15 * Math.sin(t * .3 + 2), y: .55 + .15 * Math.sin(t * .25), r: 900, a: cena1 ? 0 : .5 },
    { c: C.ciano, x: .5 + .3 * Math.sin(t * .22 + 4), y: .85 + .05 * Math.cos(t * .5), r: 650, a: cena1 ? 0 : .25 },
    { c: C.laranja, x: .7 + .2 * Math.cos(t * .28), y: .12 + .08 * Math.sin(t * .6), r: 600, a: cena1 ? .05 : .28 }
  ];
  ctx.save(); ctx.globalCompositeOperation = "screen";
  for (const L of luzes) {
    if (L.a <= 0) continue;
    const a = L.a * (1 + b * .35) * (t < 3.2 && !cena1 ? prog(t, 3, 3.2) : 1);
    const rg = ctx.createRadialGradient(L.x * W, L.y * H, 0, L.x * W, L.y * H, L.r);
    rg.addColorStop(0, rgba(L.c, a)); rg.addColorStop(.45, rgba(L.c, a * .35)); rg.addColorStop(1, rgba(L.c, 0));
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  // grade de energia em perspectiva no chão, bem sutil
  if (!cena1) {
    ctx.save(); ctx.globalAlpha = .07 + b * .05; ctx.strokeStyle = C.ciano; ctx.lineWidth = 2;
    const hz = H * .62;
    for (let i = -8; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 40, hz); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke(); }
    for (let i = 0; i < 9; i++) { const k = ((i + (t * 1.2) % 1) / 9); const y = hz + Math.pow(k, 2) * (H - hz); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
  }
}
function acabamento(t) {
  // vinheta
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.62)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // granulado de filme (muda a cada quadro)
  if (!padraoGrao) padraoGrao = ctx.createPattern(grao, "repeat");
  const q = Math.floor(t * FPS);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = "overlay";
  ctx.translate(-hash(q) * 256, -hash(q + 999) * 256); ctx.scale(1.5, 1.5);
  ctx.fillStyle = padraoGrao; ctx.fillRect(0, 0, W + 512, H + 512);
  ctx.restore();
}

/* ---------- elemento fixo: barra de carga (no topo) ---------- */
const BX = 800, BY = 62, BW = 320, BH = 40;
const CARGA = [[0, .03], [2.95, .03], [3.2, .25], [6.45, .25], [6.8, .35], [9.95, .35], [10.25, .42], [10.7, .42], [10.95, .48],
  [12.4, .48], [12.65, .54], [14.1, .54], [14.35, .60], [16, .62], [18.5, .66], [19.6, .66], [19.85, .72], [23.3, .72], [23.55, .78],
  [27.0, .78], [27.25, .84], [30.5, .86], [30.7, .86], [31.7, .91], [34.35, .96], [34.55, 1], [40, 1]];
function carga(t) {
  for (let i = 1; i < CARGA.length; i++) {
    const [t0, v0] = CARGA[i - 1], [t1, v1] = CARGA[i];
    if (t <= t1) return lerp(v0, v1, eOutCubic(prog(t, t0, t1)));
  }
  return 1;
}
function cabecaBarra(t) { return { x: BX + 6 + (BW - 12) * carga(t), y: BY + BH / 2 }; }
function barraCarga(t) {
  const nivel = carga(t), b = batida(t);
  const fraca = t < 3, cheia = t >= 34.55;
  const entrada = eOutCubic(prog(t, 0.05, .5));
  const cy = BY + BH / 2;
  ctx.save();
  ctx.globalAlpha = entrada;
  ctx.translate(0, (1 - entrada) * -30);
  const pisca = fraca ? (Math.exp(-(t % BEAT) * 5) > .35 ? 1 : .35) : 1;
  // rótulos dos lados
  ctx.textBaseline = "middle";
  ctx.font = '800 22px "Montserrat"'; ctx.textAlign = "right"; ctx.letterSpacing = "4px";
  ctx.fillStyle = fraca ? rgba(C.chama, pisca) : (cheia ? C.ciano : C.texto);
  ctx.fillText(fraca ? "BATERIA FRACA" : (cheia ? "CARREGADO ⚡" : "CARREGANDO…"), BX - 64, cy + 1);
  ctx.letterSpacing = "0px";
  ctx.font = '400 40px "Anton"'; ctx.textAlign = "left";
  ctx.fillStyle = fraca ? rgba(C.chama, pisca) : C.branco;
  if (cheia) { ctx.shadowColor = C.ciano; ctx.shadowBlur = 24; }
  ctx.fillText(Math.round(nivel * 100) + "%", BX + BW + 76, cy + 2);
  ctx.shadowBlur = 0;
  // corpo da bateria
  rrect(BX, BY, BW, BH, 12);
  ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = fraca ? rgba(C.chama, .5 + pisca * .5) : "rgba(255,255,255,.55)"; ctx.stroke();
  rrect(BX + BW + 3, BY + 11, 11, BH - 22, 4); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  // + e − como na logo
  ctx.font = '800 36px "Montserrat"'; ctx.textAlign = "center";
  ctx.fillStyle = C.ciano; ctx.fillText("+", BX - 30, cy + 1);
  ctx.fillStyle = C.chama; ctx.fillText("−", BX + BW + 44, cy + 1);
  // preenchimento
  const fw = (BW - 12) * nivel;
  ctx.save();
  rrect(BX + 6, BY + 6, Math.max(fw, 3), BH - 12, 8); ctx.clip();
  const g = ctx.createLinearGradient(BX, 0, BX + BW, 0);
  if (fraca) { g.addColorStop(0, C.chama); g.addColorStop(1, C.chama); }
  else { g.addColorStop(0, C.chama); g.addColorStop(.4, C.laranja); g.addColorStop(.7, C.amarelo); g.addColorStop(1, C.ciano); }
  ctx.fillStyle = g; ctx.globalAlpha = fraca ? pisca : 1;
  ctx.fillRect(BX, BY, BW, BH);
  // listras andando (sempre em movimento)
  ctx.globalAlpha = .18; ctx.fillStyle = "#fff";
  const off = (t * 90) % 28;
  for (let x = BX - 60 + off; x < BX + BW; x += 28) { ctx.beginPath(); ctx.moveTo(x, BY + BH); ctx.lineTo(x + 12, BY + BH); ctx.lineTo(x + 34, BY); ctx.lineTo(x + 22, BY); ctx.fill(); }
  // pulso de luz correndo a cada batida
  if (!fraca) {
    const fase = ((t - 3) % BEAT) / BEAT;
    const px = BX + 6 + fw * eOutCubic(fase);
    const pg = ctx.createLinearGradient(px - 60, 0, px + 14, 0);
    pg.addColorStop(0, "rgba(255,255,255,0)"); pg.addColorStop(1, "rgba(255,255,255,.9)");
    ctx.globalAlpha = .65 * (1 - fase); ctx.fillStyle = pg; ctx.fillRect(px - 60, BY, 74, BH);
  }
  ctx.restore();

  const cab = cabecaBarra(t);

    f.type = "bandpass"; f.Q.value = Q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);

  function impacto(s, v = 1) {
    const t = T(s), o = osc("sine", 90, t, 1.8), a = g(0);

    const t = T(s), r = fonteRuido(t, 2.4), f = ac.createBiquadFilter(), a = g(0);

  function bip(s, fq = 760, v = .1) { const t = T(s), o = osc("square", fq, t, .14), f = ac.createBiquadFilter(), a = g(0); f.type = "lowpass"; f.frequency.value = 1800; env(a.gain, t, .004, v, .12); o.connect(f); f.connect(a); a.connect(mestre); }
  function carregar(s) { const t = T(s), o = osc("sine", 500, t, .22), a = g(0); o.frequency.exponentialRampToValueAtTime(1500, t + .18); env(a.gain, t, .005, .16, .2); o.connect(a); a.connect(mestre); a.connect(eco); }

    const t = T(s), o = osc("sawtooth", fq, t, dur), f = ac.createBiquadFilter(), a = g(0), lfo = osc("square", vel, t, dur), prof = g(.13);

  for (let s = 0; s < 3; s += BEAT) bip(s, 760, .07);           // alerta piscando

  { const t = T(0), o = osc("sine", 55, t, 3), a = g(0); o.frequency.linearRampToValueAtTime(70, t + 3); a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(.22, t + 2.8); a.gain.linearRampToValueAtTime(0, t + 3.02); o.connect(a); a.connect(mestre); }

  { const t = T(34.45), o = osc("sawtooth", 200, t, .7), f = ac.createBiquadFilter(), a = g(0); o.frequency.exponentialRampToValueAtTime(1600, t + .5); f.type = "lowpass"; f.frequency.value = 3000; env(a.gain, t, .01, .12, .6); o.connect(f); f.connect(a); a.connect(mestre); a.connect(eco); }

/* ---------- WAV (para gerar o MP4 fora do navegador) ---------- */
async function gerarWav() {
  const sr = 48000, oac = new OfflineAudioContext(2, sr * DUR, sr);
  agendarAudio(oac, oac.destination, 0);
  const buf = await oac.startRendering();
  const n = buf.length, dados = new DataView(new ArrayBuffer(44 + n * 4));
  const esc = (o, s) => { for (let i = 0; i < s.length; i++) dados.setUint8(o + i, s.charCodeAt(i)); };
  esc(0, "RIFF"); dados.setUint32(4, 36 + n * 4, true); esc(8, "WAVE"); esc(12, "fmt ");
  dados.setUint32(16, 16, true); dados.setUint16(20, 1, true); dados.setUint16(22, 2, true); dados.setUint32(24, sr, true);
  dados.setUint32(28, sr * 4, true); dados.setUint16(32, 4, true); dados.setUint16(34, 16, true); esc(36, "data"); dados.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0, o = 44; i < n; i++, o += 4) { dados.setInt16(o, clamp(L[i], -1, 1) * 32767, true); dados.setInt16(o + 2, clamp(R[i], -1, 1) * 32767, true); }
  let bin = ""; const u8 = new Uint8Array(dados.buffer);
  for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(bin);
}

/* ---------- tocar e gravar ---------- */
const pronto = Promise.all([document.fonts.load('400 100px "Anton"'), document.fonts.load('600 40px "Montserrat"'), document.fonts.load('800 40px "Montserrat"'),
  LOGO.decode().catch(() => {}), RAIO.decode().catch(() => {})]).then(() => { cacheMedida.clear(); render(0); });
window.VIDEO = { render, gerarWav, pronto, DUR, FPS };

const btBaixar = document.getElementById("baixar"), btAssistir = document.getElementById("assistir");
const status = document.getElementById("status"), barra = document.getElementById("progresso");
let ocupado = false;
function tocar(gravar) {
  if (ocupado) return; ocupado = true;
  btBaixar.disabled = btAssistir.disabled = true;
  const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  const destino = gravar ? ac.createMediaStreamDestination() : null;
  const T0 = ac.currentTime + .25;
  const mix = ac.createGain(); mix.connect(ac.destination);
  if (destino) mix.connect(destino);
  agendarAudio(ac, mix, T0);
  let gravador = null, pedacos = [], tipo = "";
  if (gravar) {
    const tipos = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1.4d002a,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"];
    tipo = tipos.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
    const fluxo = canvas.captureStream(FPS);
    destino.stream.getAudioTracks().forEach(tr => fluxo.addTrack(tr));
    gravador = new MediaRecorder(fluxo, { mimeType: tipo, videoBitsPerSecond: 10000000, audioBitsPerSecond: 256000 });
    gravador.ondataavailable = e => e.data.size && pedacos.push(e.data);
    gravador.onstop = () => {
      const mp4 = tipo.startsWith("video/mp4");
      const blob = new Blob(pedacos, { type: mp4 ? "video/mp4" : "video/webm" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = mp4 ? "cardoso-site.mp4" : "cardoso-site.webm"; document.body.appendChild(a); a.click(); a.remove();
      status.textContent = mp4 ? "Pronto! O MP4 foi baixado (veja a pasta Downloads)." : "Pronto! Seu navegador não grava MP4, então baixei em WEBM. Use o Google Chrome atualizado para MP4.";
      ocupado = false; btBaixar.disabled = btAssistir.disabled = false;
    };
    setTimeout(() => gravador.start(250), Math.max(0, (T0 - ac.currentTime) * 1000 - 60));
    status.textContent = "Gravando… não troque de aba nem minimize a janela.";
  } else status.textContent = "Tocando…";
  const quadro = () => {
    const t = ac.currentTime - T0;
    render(Math.max(0, t));
    barra.style.width = (clamp(t / DUR) * 100) + "%";
    if (t < DUR + .1) requestAnimationFrame(quadro);
    else {
      if (gravador) { status.textContent = "Finalizando o arquivo…"; gravador.stop(); }
      else { status.textContent = "Fim. Clique em Baixar MP4 para gravar o vídeo."; ocupado = false; btBaixar.disabled = btAssistir.disabled = false; }
      setTimeout(() => ac.close(), 500);
    }
  };
  requestAnimationFrame(quadro);
}
btBaixar.onclick = () => pronto.then(() => tocar(true));
btAssistir.onclick = () => pronto.then(() => tocar(false));
